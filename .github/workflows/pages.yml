name: Publicar o painel (GitHub Pages)

# Publica só a pasta painel/ (HTML, JS e CSS estáticos, sem segredo algum).
# Ligue uma vez em Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "painel/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: painel
      - id: deployment
        uses: actions/deploy-pages@v4
